# m65_test.cfg – linker config for the m65 macro test bundle (T7)
# Owner: doc/platform_layer.md
#
# A raw flat binary: the ZEROPAGE segment's $B0 bytes (CSE's base page,
# loaded at 0.1F00, B = $1F), then the code at $4000 (bank 0).
#
#   ld65 -C dev/m65_test.cfg obj.o -o out.bin

MEMORY {
    BP:  start = $0000, size = $00B0, type = rw, fill = yes, fillval = $00, define = yes;
    RAM: start = $4000, size = $1000, type = rw, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = BP,  type = zp;
    CODE:     load = RAM, type = rw;
    BSS:      load = RAM, type = bss, optional = yes;
}
