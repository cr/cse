# m65_test.cfg – linker config for the m65 test bundles
# Owner: doc/platform_layer.md
#
# A raw flat binary: the ZEROPAGE segment's $B0 bytes (CSE's base page,
# loaded at 0.1F00, B = $1F), then the code and its data at $4000 (bank 0).
# The macro bundle (T7) and the m65-45gs02 asm_core / dasm bundles.
#
#   ld65 -C dev/m65_test.cfg obj.o -o out.bin

MEMORY {
    ZP:  start = $0000, size = $00B0, type = rw, fill = yes, fillval = $00, define = yes;
    RAM: start = $4000, size = $4000, type = rw, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = RAM, type = rw;
    RODATA:   load = RAM, type = ro,  optional = yes;
    KDATA:    load = RAM, type = ro,  optional = yes;
    KCODE:    load = RAM, type = ro,  optional = yes;   # m65 code in the data window
    BSS:      load = RAM, type = bss, optional = yes;
    STUB:     load = RAM, type = rw,  optional = yes;   # mem.s's resident stub (unused here)
}
