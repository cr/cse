# m65_cse.cfg — the m65 build's linker config
# Owner: doc/build_system.md
#
# doc/build_system.md § The m65 builds; the places are
# doc/memory_design.md § Memory Map — m65.  Every run address is fixed
# by the region it lives in, so there is no layout pass: one MEMORY
# area per place the code runs, each bounded by its region, so an
# overflow fails the link.  The PRG image (bank 0, from $2001) holds
# the BASIC 65 SYS line, the loader, and the images the loader
# installs: the stub to 0.1FB0, CODE + RODATA and KDATA to bank 3.

MEMORY {
    # CSE's base page 0.1F00 (B = CSE_BP), below the resident stub ($B0).
    ZP:       file = "",  define = yes, start = $0000, size = $00B0;
    LOADADDR: file = %O,               start = $2001 - 2, size = $0002;
    HEADER:   file = %O,  define = yes, start = $2001,   size = $000C;
    LOADIMG:  file = %O,  define = yes, start = __HEADER_LAST__, size = $C000 - __HEADER_LAST__;
    # the resident stub, 0.1FB0-0.1FFF
    STUB:     file = "",               start = $1FB0,   size = $0050;
    # the code window $2000-$7FFF -> 3.2000
    CODEWIN:  file = "",               start = $2000,   size = $6000;
    # the data window $8000 -> 3.8000, below SYM_TABLE ($A100)
    DATAWIN:  file = "",               start = $8000,   size = $2100;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    LOADER:   load = LOADIMG,  type = ro,  define = yes;
    STUB:     load = LOADIMG,  run = STUB,    type = ro, define = yes;
    CODE:     load = LOADIMG,  run = CODEWIN, type = ro, define = yes;
    RODATA:   load = LOADIMG,  run = CODEWIN, type = ro, define = yes;
    KDATA:    load = LOADIMG,  run = DATAWIN, type = ro, define = yes;
    BSS:      load = DATAWIN,  type = bss, define = yes;
}
